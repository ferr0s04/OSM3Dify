# Configuração por omissão do pipeline (geral: não depende de nenhuma área).
# O que é de uma instalação vai para config/local.yaml (ignorado pelo git), só com as
# chaves que mudam: é junto por cima deste ficheiro automaticamente. Exemplo:
#
#   area:
#     label: Nome da minha área
#     tiles: [155480, 156480]
#   sources:
#     municipal:
#       enabled: true
#       name: Câmara Municipal de …
#       viewer_url: https://…/geoportal
#       ...

area:
  # Área inicial, sem quadrículas: escolhem-se na aplicação (separador "Dados": clicar
  # no mapa ou juntar o limite de uma relação OSM) ou com `osm3d area --tiles`. As
  # outras áreas ficam em data/areas.json.
  #
  # Uma área é só uma lista de quadrículas LiDAR de 1 km (identificadores DGT). As
  # mesmas quadrículas definem o LAZ/MDT a descarregar e os edifícios OSM processados
  # (centróide dentro das quadrículas).
  # O id é neutro (dá a pasta data/processed/<id>); o nome a mostrar é só uma etiqueta.
  name: area-1
  tiles: []

# Todo o processamento é feito num CRS métrico; só a exportação OSM reprojeta para WGS84.
processing_crs: "EPSG:3763"  # PT-TM06/ETRS89

paths:
  raw: data/raw
  processed: data/processed
  output: data/output
  reference: data/reference

sources:
  overpass_url: https://overpass-api.de/api/interpreter
  # API STAC do Centro de Dados da DGT (requer conta; credenciais em .env, nunca aqui).
  # API não documentada oficialmente; endpoint e coleções retirados de clientes
  # da comunidade (GMT.jl dgt_lidar, qgispt/dgtcd_downer).
  dgt_stac_url: https://cdd.dgterritorio.gov.pt/dgt-be/v1/
  dgt_collections:
    lidar: LAZ
    dtm: MDT-50cm
    dsm: MDS-50cm
    orthophoto: ORTOS-2025
  dgt_delay_s: 2.0                 # pausa entre pedidos ao portal (uso responsável)
  # Grelha oficial das quadrículas LiDAR 2024–2025 (separador "Dados" da aplicação).
  # A coluna DISPONIVEL está desatualizada: só informativa (ver docs/validacao.md).
  dgt_tile_index: data/raw/dgt/LiDAR2024_2025_Seccionamento.gpkg
  lidar_dir: data/raw/lidar        # ficheiros LAZ (quadrículas 1 km x 1 km)
  dtm_dir: data/raw/dtm            # MDT GeoTIFF do mesmo levantamento LiDAR
  dsm_dir: data/raw/dsm            # MDS GeoTIFF (opcional)
  orthophoto_dir: data/raw/orthophotos
  # Cartografia municipal de edifícios (opcional): a fonte da fase candidates (edifícios
  # em falta no OSM). Só com autorização do município. Polígonos sem contorno no OSM e
  # confirmados pelo LiDAR passam a candidatos com o contorno municipal; o LiDAR dá-lhes
  # a forma e a altura do telhado. Não há deteção de edifícios só pelo LiDAR.
  #
  # Uma câmara em `municipal` (forma antiga) e/ou várias em `municipalities` (lista com
  # os mesmos campos). Cada área usa as câmaras cuja extensão (`bbox`, EPSG:3763; sem
  # ela, a da cópia do concelho ou a pedida uma vez à fonte) a cobre; na fronteira entre
  # concelhos, todas, sem repetir edifícios. Tipos de fonte (`kind`):
  #   mapguide: geoportal Autodesk MapGuide (viewer_url, mapagent_url, feature_source,
  #             feature_class, filter);
  #   arcgis:   serviço ArcGIS REST (layer_url = …/MapServer/<n>, type_field);
  #   file:     ficheiro de dados abertos, p.ex. GeoPackage do dados.gov.pt (file_url,
  #             layer), descarregado uma vez para cache_dir.
  # Classificação dos tipos (`types`): catalogo ("Vivenda Casa", "06020103-PRÉDIO"…) ou
  # carttop (modelo CartTop da DGT). Muros: `barriers` (camadas e regras de tags).
  # Exemplos no config/local.yaml (que configura as câmaras desta instalação).
  # Ver src/osm3d/acquisition/municipal*.py e src/osm3d/municipal_area.py.
  municipal:
    enabled: false
    chunk_m: 250       # caixa de cada pedido (por área)
    full_chunk_m: 1000 # caixa de cada pedido (todo o concelho)
    delay_s: 0.5       # pausa entre pedidos (uso responsável)
    min_area_m2: 8.0
    cache_dir: data/raw/municipal  # cópia de todo o concelho (descarregada a pedido)

footprints:
  min_area_m2: 20.0
  # Pesquisa de deslocamento footprint <-> LiDAR (co-registo).
  registration_max_shift_m: 3.0
  registration_step_m: 0.25

heights:
  building_classes: [6]            # ASPRS: 6 = edifício
  excluded_classes: [3, 4, 5, 7]   # vegetação e ruído
  roof_percentile: 95
  ground_ring_buffer_m: 2.0
  ground_percentile: 5
  ndsm_resolution_m: 0.5
  min_points_per_building: 50

roofs:
  # side_hipped = "três águas": hip numa ponta, empena na outra (roof:direction = ponta em hip).
  # round = abóbada / meia-lua (estufas, pavilhões); eixo via roof:orientation.
  candidate_shapes: [flat, skillion, gabled, hipped, side_hipped, pyramidal, round]
  flat_max_slope_deg: 5.0
  # Abaixo deste valor de confiança a forma é exportada como desconhecida (não é tag).
  min_shape_confidence: 0.7
  # RMSE máximo do melhor modelo; acima disto a forma fica "unknown" (vai para revisão).
  # Calibrado em Vila do Conde (82 edifícios com roof:shape): 0.20 → exatidão 87 %,
  # cobertura 67 %; 0.35 → 79 % / 85 %. Os erros concentram-se em RMSE 0.24–0.27 m
  # (telhados complexos para os quais "skillion" era só o modelo menos mau).
  max_rmse_m: 0.20

appearance:
  # roof:colour a partir do ortofoto (se houver) confirmado pelo RGB do LiDAR, com uma
  # paleta realista (telha, telha escura, vermelho, laranja, verde, branco, cinzentos).
  # Ver src/osm3d/appearance/roof_colours.py. A cor das fachadas não é estimada: o
  # LiDAR aéreo não tem pontos nas fachadas.
  enabled: true
  min_colour_confidence: 0.6

topology:
  # Edifícios novos (candidatos) face ao que já está no OSM, na fase candidates e outra
  # vez na exportação: vias que os atravessam, limites de landuse e edifícios OSM ou
  # novos sobrepostos. Recortam-se só lascas (finas e pequenas), com uma folga ao
  # elemento do OSM; o resto fica sinalizado (overlaps_osm_building, crosses_highway,
  # overlaps_new_building, straddles_landuse). Ver src/osm3d/validation/topology.py.
  clearance_m: 0.1
  max_trim_m: 1.0           # espessura máxima de uma lasca
  max_trim_fraction: 0.15   # da área do edifício
  landuse: true

export:
  height_rounding_m: 0.5
  roof_height_rounding_m: 0.5
  overwrite_existing_tags: false   # nunca sobrescrever tags mapeadas por humanos por omissão
  roof_colour: true                # false: não acrescentar/alterar roof:colour estimado (a cor escolhida à mão na revisão vai na mesma)
  export_parts_to_osm: false       # Fase 6
  include_pending: false           # só os edifícios aceites na aplicação de revisão
  josm_upload: "true"              # "never" faz o JOSM recusar o upload; "false" só avisa
