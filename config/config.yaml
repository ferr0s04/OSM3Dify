# Configuração por omissão do pipeline.
# Para alterações locais, copiar para config/local.yaml (ignorado pelo git)
# e usar `osm3d --config config/local.yaml ...`.

area:
  # Área inicial. As outras áreas criam-se na aplicação (separador "Dados") ou com
  # `osm3d area`, e ficam em data/areas.json.
  #
  # Uma área é só uma lista de quadrículas LiDAR de 1 km (identificadores DGT). As
  # mesmas quadrículas definem o LAZ/MDT a descarregar e os edifícios OSM processados
  # (centróide dentro das quadrículas).
  # Estas são as 18 que cobrem a União das Freguesias de Vilar e Mosteiró
  # (relação OSM 5989576). Ver docs/area-de-estudo.md.
  # O id é neutro (dá a pasta data/processed/<id>); o nome a mostrar é só uma etiqueta.
  name: area-1
  label: Vilar e Mosteiró
  tiles: [152479, 152480, 152481, 153479, 153480, 153481, 154479, 154480, 154481,
          155479, 155480, 155481, 156479, 156480, 156481, 157479, 157480, 157481]

# Todo o processamento é feito num CRS métrico; só a exportação OSM reprojeta para WGS84.
processing_crs: "EPSG:3763"  # PT-TM06/ETRS89

paths:
  raw: data/raw
  processed: data/processed
  output: data/output
  reference: data/reference

sources:
  overpass_url: https://overpass-api.de/api/interpreter
  # API STAC do Centro de Dados da DGT (requer conta; credenciais em .env, nunca aqui).
  # API não documentada oficialmente; endpoint e coleções retirados de clientes
  # da comunidade (GMT.jl dgt_lidar, qgispt/dgtcd_downer).
  dgt_stac_url: https://cdd.dgterritorio.gov.pt/dgt-be/v1/
  dgt_collections:
    lidar: LAZ
    dtm: MDT-50cm
    dsm: MDS-50cm
    orthophoto: ORTOS-2025
  dgt_delay_s: 2.0                 # pausa entre pedidos ao portal (uso responsável)
  # Grelha oficial das quadrículas LiDAR 2024–2025 (separador "Dados" da aplicação).
  # A coluna DISPONIVEL está desatualizada: só informativa (ver docs/area-de-estudo.md).
  dgt_tile_index: data/raw/dgt/LiDAR2024_2025_Seccionamento.gpkg
  lidar_dir: data/raw/lidar        # ficheiros LAZ (quadrículas 1 km x 1 km)
  dtm_dir: data/raw/dtm            # MDT GeoTIFF do mesmo levantamento LiDAR
  dsm_dir: data/raw/dsm            # MDS GeoTIFF (opcional)
  orthophoto_dir: data/raw/orthophotos
  # Cartografia municipal de edifícios (1:5000 homologada, ~2017) do geoportal
  # MapGuide da Câmara, usada na fase candidates (uso autorizado pelo município).
  # Polígonos confirmados pelo LiDAR passam a candidatos com o contorno municipal;
  # candidatos só do LiDAR que não constam dela são sinalizados.
  # Ver src/osm3d/acquisition/municipal.py.
  municipal:
    enabled: true
    name: Câmara Municipal de Vila do Conde
    viewer_url: https://sig.cm-viladoconde.pt/geoportal
    mapagent_url: https://sig.cm-viladoconde.pt/mapguide/mapagent/mapagent.fcgi
    chunk_m: 250       # caixa de cada pedido
    delay_s: 0.5       # pausa entre pedidos (uso responsável)
    min_area_m2: 8.0

footprints:
  min_area_m2: 20.0
  # Pesquisa de deslocamento footprint <-> LiDAR (co-registo).
  registration_max_shift_m: 3.0
  registration_step_m: 0.25

heights:
  building_classes: [6]            # ASPRS: 6 = edifício
  excluded_classes: [3, 4, 5, 7]   # vegetação e ruído
  roof_percentile: 95
  ground_ring_buffer_m: 2.0
  ground_percentile: 5
  ndsm_resolution_m: 0.5
  min_points_per_building: 50

roofs:
  # side_hipped = "três águas": hip numa ponta, empena na outra (roof:direction = ponta em hip).
  # round = abóbada / meia-lua (estufas, pavilhões); eixo via roof:orientation.
  candidate_shapes: [flat, skillion, gabled, hipped, side_hipped, pyramidal, round]
  flat_max_slope_deg: 5.0
  # Abaixo deste valor de confiança a forma é exportada como desconhecida (não é tag).
  min_shape_confidence: 0.7
  # RMSE máximo do melhor modelo; acima disto a forma fica "unknown" (vai para revisão).
  # Calibrado em Vila do Conde (82 edifícios com roof:shape): 0.20 → exatidão 87 %,
  # cobertura 67 %; 0.35 → 79 % / 85 %. Os erros concentram-se em RMSE 0.24–0.27 m
  # (telhados complexos para os quais "skillion" era só o modelo menos mau).
  max_rmse_m: 0.20

appearance:
  # roof:colour a partir do ortofoto (se houver) confirmado pelo RGB do LiDAR, com uma
  # paleta realista (telha, telha escura, vermelho, laranja, verde, branco, cinzentos).
  # Ver src/osm3d/appearance/roof_colours.py. A cor das fachadas não é estimada: o
  # LiDAR aéreo não tem pontos nas fachadas.
  enabled: true
  min_colour_confidence: 0.6

export:
  height_rounding_m: 0.5
  roof_height_rounding_m: 0.5
  overwrite_existing_tags: false   # nunca sobrescrever tags mapeadas por humanos por omissão
  export_parts_to_osm: false       # Fase 6
  include_pending: false           # só os edifícios aceites na aplicação de revisão
  josm_upload: "true"              # "never" faz o JOSM recusar o upload; "false" só avisa
