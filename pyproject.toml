[project]
name = "osm3d"
version = "0.1.0"
description = "Geração de edifícios 3D simples (Simple 3D Buildings) para o OpenStreetMap a partir de LiDAR, MDT e ortofotos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "geopandas>=1.0",
    "laspy[lazrs]>=2.5",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "requests>=2.32",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shapely>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Leitura de extratos PBF (Geofabrik) para áreas maiores.
osm = ["osmium>=4.0"]
# Exportação GLB para inspeção visual.
mesh = ["trimesh>=4.4"]

[project.scripts]
osm3d = "osm3d.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
