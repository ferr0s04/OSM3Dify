<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>osm3d — Revisão</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">osm3d <span class="muted">revisão</span> <span id="area-name" class="chip"></span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="review">Revisão</button>
      <button class="tab" data-tab="results">Resultados</button>
      <button class="tab" data-tab="data" title="Quadrículas LiDAR: selecionar área, descarregar e eliminar ficheiros raw">Dados</button>
    </nav>
    <div class="progress" id="progress"></div>
    <select id="archive-action" class="btn" title="Arquivar decisões já tratadas: deixam de aparecer na lista e no mapa e de ser exportadas">
      <option value="">Arquivo…</option>
      <option value="accepted">Arquivar aceites (já submetidos ao OSM)</option>
      <option value="rejected">Arquivar rejeitados</option>
      <option value="unarchive-accepted">Desarquivar aceites</option>
      <option value="unarchive-rejected">Desarquivar rejeitados</option>
    </select>
    <button id="btn-export" class="btn primary" title="Gera o .osm para o JOSM (aplica as revisões)">Exportar .osm</button>
  </header>

  <main id="view-review" class="view review-layout">

    <section class="map-pane">
      <div id="map"></div>
      <div class="filterbar" id="filterbar">
        <input id="f-search" type="search" placeholder="id OSM…" title="Procurar por id OSM">
        <span class="fgroup" data-group="change" title="Relação com o OSM (nenhum = todos)">
          <span class="flabel">OSM</span>
          <button data-v="novo">novo</button><button data-v="complementa">complementa</button><button data-v="diverge">diverge</button><button data-v="igual">igual</button>
        </span>
        <span class="fgroup" data-group="status" title="Estado da revisão (nenhum = todos)">
          <span class="flabel">estado</span>
          <button data-v="pending">por rever</button><button data-v="accepted">aceites</button><button data-v="rejected">rejeitados</button>
        </span>
        <label class="check" title="Só edifícios com sinalizações (rever primeiro)"><input id="f-flagged" type="checkbox"> sinalizados</label>
        <label class="check" title="Mostrar aceites já submetidos e rejeitados arquivados"><input id="f-archived" type="checkbox"> arquivados</label>
        <span id="f-count" class="muted small"></span>
        <span class="hint small muted" title="J/K seguinte/anterior · A aceitar · R rejeitar · U repor"><kbd>J</kbd>/<kbd>K</kbd></span>
      </div>
      <div class="map-controls">
        <select id="m-color" title="Colorir por">
          <option value="real">Cor: cores reais (roof:colour)</option>
          <option value="change">Cor: alterações ao OSM</option>
          <option value="status">Cor: estado da revisão</option>
          <option value="match">Cor: concordância com OSM</option>
          <option value="shape">Cor: forma do telhado (análise)</option>
        </select>
        <label class="check"><input id="m-3d" type="checkbox"> 3D</label>
      </div>
      <div id="legend" class="legend"></div>
    </section>

    <section class="detail-pane">
      <div class="viewer-wrap">
        <div id="viewer"></div>
        <div id="planner" class="planner hidden"></div>
        <div class="view-toggle">
          <button id="vt-3d" class="active" title="Modelo 3D sobre os pontos LiDAR">3D</button>
          <button id="vt-plan" title="Planta: editar a divisão em partes">Planta</button>
        </div>
        <div class="viewer-controls" id="controls-3d">
          <select id="v-color" title="Cor dos pontos">
            <option value="rgb">Pontos: RGB</option>
            <option value="class">Pontos: classe</option>
            <option value="inside">Pontos: do edifício</option>
          </select>
          <label class="check"><input id="v-points" type="checkbox" checked> pontos</label>
          <label class="check"><input id="v-context" type="checkbox" checked> contexto</label>
          <label class="check"><input id="v-model" type="checkbox" checked> modelo</label>
          <label class="check"><input id="v-transparent" type="checkbox" checked> transparente</label>
        </div>
        <div class="viewer-controls hidden" id="controls-plan">
          <button class="btn mini" id="pe-split" title="Dividir a parte selecionada (S)">✂ Dividir</button>
          <button class="btn mini" id="pe-merge" title="Juntar a parte selecionada à vizinha">⧉ Juntar</button>
          <button class="btn mini" id="pe-square" title="Esquadrar a parte selecionada (Q)">⊾ Esquadrar</button>
          <button class="btn mini" id="pe-undo" title="Desfazer (Ctrl+Z)">↶</button>
          <span class="pe-help" title="Arrastar vértices · clicar no + a meio de um lado cria um vértice · Delete remove o vértice · roda = zoom · arrastar o fundo = mover">?</span>
        </div>
        <div id="viewer-status" class="viewer-status"></div>
      </div>
      <div id="detail" class="detail"><p class="muted pad">Selecione um edifício na lista ou no mapa.</p></div>
    </section>
  </main>

  <main id="view-results" class="view results-layout hidden"></main>

  <main id="view-data" class="view data-layout hidden">
    <section class="map-pane">
      <div id="data-map"></div>
      <div id="data-hover" class="legend data-legend"></div>
    </section>
    <section id="data-panel" class="data-panel detail"></section>
  </main>

  <datalist id="palette"></datalist>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
