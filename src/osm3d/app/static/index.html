<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSM3Dify</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="/static/favicon.svg" alt="">OSM3Dify <span id="area-name" class="chip"></span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="review">Revisão</button>
      <button class="tab" data-tab="results">Resultados</button>
      <button class="tab" data-tab="data" title="Quadrículas LiDAR: selecionar área, descarregar e eliminar ficheiros raw">Dados</button>
    </nav>
    <div class="progress" id="progress"></div>
    <select id="archive-action" class="btn" title="Arquivar decisões já tratadas: deixam de aparecer na lista e no mapa e de ser exportadas">
      <option value="">Arquivo…</option>
      <option value="accepted">Arquivar aceites (já submetidos ao OSM)</option>
      <option value="rejected">Arquivar rejeitados</option>
      <option value="unarchive-accepted">Desarquivar aceites</option>
      <option value="unarchive-rejected">Desarquivar rejeitados</option>
    </select>
    <label class="check topbar-opt" title="Desmarcado: as tags propostas e o .osm exportado não acrescentam nem alteram roof:colour com a cor estimada (o valor já mapeado no OSM, se houver, fica). Uma cor escolhida à mão na revisão é exportada na mesma. Fica guardado para as próximas sessões."><input id="opt-roof-colour" type="checkbox" checked> roof:colour</label>
    <button id="btn-export" class="btn primary" title="Gera o .osm para o JOSM (aplica as revisões)">Exportar .osm</button>
  </header>

  <main id="view-review" class="view review-layout">

    <section class="map-pane">
      <div id="map"></div>
      <!-- Uma só barra: pesquisa, filtros da lista, cor, camadas do mapa e 3D. A revisão é dos
           edifícios da cartografia municipal; os do OSM são uma camada ("Camadas"). -->
      <div class="map-toolbar">
      <div class="filterbar" id="filterbar">
        <input id="f-search" type="search" placeholder="id…" title="Procurar por id">
        <details class="msel" id="f-menu" title="Filtros da lista e do mapa (nada marcado num grupo = todos)">
          <summary></summary>
          <div class="msel-menu">
            <div class="fgroup" data-group="status" data-label="estado">
              <div class="fgroup-title">estado</div>
              <label><input type="checkbox" value="pending" checked> por rever</label>
              <label><input type="checkbox" value="accepted"> aceites</label>
              <label><input type="checkbox" value="rejected"> rejeitados</label>
            </div>
            <div class="fgroup" data-group="extra" data-label="mais">
              <div class="fgroup-title">mais</div>
              <label title="Só edifícios com sinalizações (rever primeiro)"><input type="checkbox" value="flagged"> só sinalizados</label>
              <label title="Mostrar aceites já submetidos e rejeitados arquivados"><input type="checkbox" value="archived"> incluir arquivados</label>
            </div>
          </div>
        </details>
        <select id="m-color" title="Colorir os edifícios por">
          <option value="real">Cor: cores reais</option>
          <option value="status">Cor: estado da revisão</option>
          <option value="shape">Cor: forma do telhado</option>
        </select>
        <details class="msel mlayers" id="m-layers" title="Camadas do mapa: muros propostos, OSM e fundo">
          <summary>Camadas</summary>
          <div class="msel-menu">
            <div class="fgroup" id="m-walls">
              <div class="fgroup-title">muros propostos <span id="m-walls-count"></span></div>
              <label><input type="checkbox" value="pending" checked> por rever</label>
              <label><input type="checkbox" value="accepted" checked> aceites</label>
              <label><input type="checkbox" value="rejected"> rejeitados</label>
              <label><input type="checkbox" value="archived"> arquivados</label>
              <button class="btn mini-light" id="m-walls-fetch" type="button" title="Voltar a obter os muros e vedações do geoportal municipal">obter do geoportal</button>
              <div class="small muted" id="m-walls-info"></div>
            </div>
            <div class="fgroup" id="m-osm">
              <div class="fgroup-title">OSM</div>
              <label><input type="checkbox" value="landuse" checked> landuse</label>
              <label><input type="checkbox" value="highway" checked> vias</label>
              <label><input type="checkbox" value="barrier" checked> muros e vedações</label>
              <label><input type="checkbox" value="building" checked> edifícios do OSM</label>
              <button class="btn mini-light" id="m-osm-refresh" type="button" title="Voltar a obter landuse, vias, muros e edifícios do Overpass">atualizar do OSM</button>
              <div class="small muted" id="m-osm-date"></div>
            </div>
            <div class="fgroup">
              <select id="m-base" title="Fundo do mapa"><option value="osm">mapa OSM</option></select>
            </div>
          </div>
        </details>
        <label class="check"><input id="m-3d" type="checkbox"> 3D</label>
        <button class="btn mini-light" id="f-default" title="Filtros por omissão: por rever">↺</button>
        <button class="btn mini-light" id="f-clear" title="Limpar os filtros (mostrar todos)">✕</button>
        <span id="f-count" class="muted small"></span>
        <span class="hint small muted" title="J/K seguinte/anterior · A aceitar · R rejeitar · U repor"><kbd>J</kbd>/<kbd>K</kbd></span>
      </div>
      </div>
      <div id="legend" class="legend"></div>
    </section>

    <section class="detail-pane">
      <div class="viewer-wrap">
        <div id="viewer"></div>
        <div id="planner" class="planner hidden"></div>
        <div class="view-toggle">
          <button id="vt-3d" class="active" title="Modelo 3D sobre os pontos LiDAR">3D</button>
          <button id="vt-plan" title="Planta: editar a divisão em partes">Planta</button>
        </div>
        <div class="viewer-controls" id="controls-3d">
          <select id="v-color" title="Cor dos pontos">
            <option value="rgb">Pontos: RGB</option>
            <option value="class">Pontos: classe</option>
            <option value="inside">Pontos: do edifício</option>
          </select>
          <label class="check"><input id="v-points" type="checkbox" checked> pontos</label>
          <label class="check"><input id="v-context" type="checkbox" checked> contexto</label>
          <label class="check"><input id="v-model" type="checkbox" checked> modelo</label>
          <label class="check"><input id="v-transparent" type="checkbox" checked> transparente</label>
        </div>
        <div class="viewer-controls hidden" id="controls-plan">
          <button class="btn mini" id="pe-split" title="Dividir a parte selecionada (S)">✂ Dividir</button>
          <button class="btn mini" id="pe-merge" title="Juntar a parte selecionada à vizinha">⧉ Juntar</button>
          <button class="btn mini" id="pe-square" title="Esquadrar a parte selecionada (Q)">⊾ Esquadrar</button>
          <button class="btn mini" id="pe-undo" title="Desfazer (Ctrl+Z)">↶</button>
          <span class="pe-help" title="Arrastar vértices · clicar no + a meio de um lado cria um vértice · Delete remove o vértice · roda = zoom · arrastar o fundo = mover">?</span>
        </div>
        <div id="viewer-status" class="viewer-status"></div>
      </div>
      <div id="detail" class="detail"><p class="muted pad">Selecione um edifício na lista ou no mapa.</p></div>
    </section>
  </main>

  <main id="view-results" class="view results-layout hidden"></main>

  <main id="view-data" class="view data-layout hidden">
    <section class="map-pane">
      <div id="data-map"></div>
      <div class="map-controls data-base"><select id="d-base" title="Fundo do mapa"><option value="osm">Fundo: mapa OSM</option></select></div>
      <div id="data-hover" class="legend data-legend"></div>
    </section>
    <section id="data-panel" class="data-panel detail"></section>
  </main>

  <datalist id="palette"></datalist>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
